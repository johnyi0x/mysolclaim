<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Simple readable pixel piggy bank -->
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- body -->
  <rect x="6" y="10" width="18" height="12" fill="#ff8aab"/>
  <rect x="5" y="12" width="20" height="8" fill="#ff8aab"/>
  <!-- body outline -->
  <rect x="6" y="9" width="18" height="1" fill="#111111"/>
  <rect x="6" y="22" width="18" height="1" fill="#111111"/>
  <rect x="5" y="10" width="1" height="12" fill="#111111"/>
  <rect x="24" y="10" width="1" height="12" fill="#111111"/>
  <rect x="4" y="12" width="1" height="8" fill="#111111"/>
  <rect x="25" y="12" width="1" height="8" fill="#111111"/>
  <!-- ear -->
  <rect x="8" y="6" width="4" height="4" fill="#ff8aab"/>
  <rect x="8" y="5" width="4" height="1" fill="#111111"/>
  <rect x="7" y="6" width="1" height="4" fill="#111111"/>
  <rect x="12" y="6" width="1" height="4" fill="#111111"/>
  <rect x="9" y="7" width="2" height="2" fill="#e84d82"/>
  <!-- coin slot -->
  <rect x="12" y="11" width="6" height="2" fill="#111111"/>
  <!-- eye -->
  <rect x="10" y="14" width="2" height="2" fill="#111111"/>
  <!-- snout -->
  <rect x="22" y="14" width="6" height="5" fill="#e84d82"/>
  <rect x="22" y="13" width="6" height="1" fill="#111111"/>
  <rect x="22" y="19" width="6" height="1" fill="#111111"/>
  <rect x="28" y="14" width="1" height="5" fill="#111111"/>
  <rect x="24" y="16" width="1" height="1" fill="#111111"/>
  <rect x="26" y="16" width="1" height="1" fill="#111111"/>
  <!-- legs -->
  <rect x="9" y="22" width="4" height="4" fill="#e84d82"/>
  <rect x="17" y="22" width="4" height="4" fill="#e84d82"/>
  <rect x="9" y="26" width="4" height="1" fill="#111111"/>
  <rect x="17" y="26" width="4" height="1" fill="#111111"/>
  <rect x="8" y="22" width="1" height="4" fill="#111111"/>
  <rect x="13" y="22" width="1" height="4" fill="#111111"/>
  <rect x="16" y="22" width="1" height="4" fill="#111111"/>
  <rect x="21" y="22" width="1" height="4" fill="#111111"/>
</svg>
