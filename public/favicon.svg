<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Original pixel piggy bank favicon 16x16 -->
  <rect width="16" height="16" fill="#0a0a14"/>
  <!-- body -->
  <rect x="3" y="6" width="10" height="6" fill="#ff8fab"/>
  <rect x="2" y="7" width="1" height="4" fill="#ff8fab"/>
  <rect x="13" y="7" width="1" height="4" fill="#ff8fab"/>
  <!-- snout -->
  <rect x="12" y="8" width="3" height="3" fill="#e85d8a"/>
  <rect x="13" y="9" width="1" height="1" fill="#0a0a14"/>
  <!-- ear -->
  <rect x="4" y="4" width="2" height="2" fill="#ff8fab"/>
  <rect x="5" y="5" width="1" height="1" fill="#e85d8a"/>
  <!-- eye -->
  <rect x="6" y="7" width="1" height="1" fill="#0a0a14"/>
  <!-- coin slot -->
  <rect x="6" y="5" width="3" height="1" fill="#0a0a14"/>
  <!-- legs -->
  <rect x="4" y="12" width="2" height="2" fill="#e85d8a"/>
  <rect x="9" y="12" width="2" height="2" fill="#e85d8a"/>
  <!-- coin -->
  <rect x="7" y="2" width="2" height="2" fill="#7dffb3"/>
</svg>
